name: postgrest-sh-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "postgrest base tag AND output image tag (e.g. v14.18)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          build-args: |
            POSTGREST_TAG=${{ inputs.tag }}
          tags: ghcr.io/${{ github.repository_owner }}/postgrest-sh:${{ inputs.tag }}
      - name: Verify shell boot contract and PostgREST version
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/postgrest-sh:${{ inputs.tag }}
          EXPECTED_VERSION: ${{ inputs.tag }}
        run: |
          version=$(docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'exec /bin/postgrest --version')
          test "${version#PostgREST }" = "${EXPECTED_VERSION#v}"
      - name: Publish verified image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/postgrest-sh:${{ inputs.tag }}
        run: docker push "$IMAGE"
